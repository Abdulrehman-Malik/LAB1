# Serves the built Angular app. Unknown paths (e.g. /orders/5) fall back to index.html so Angular's router handles them.
# /api/* never reaches this container: Traefik sends it to the backend services.
server {
  listen 80;
  root /usr/share/nginx/html;

  location / {
    try_files $uri $uri/ /index.html;
  }
}
